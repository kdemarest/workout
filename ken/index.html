<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ken Arms">
<title>Ken Arms</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="../app.css">
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div id="week"></div>
</header>
<div class="nav">
  <button id="prev" type="button" aria-label="Previous exercise">‹</button>
  <select id="picker" aria-label="Exercise"></select>
  <button id="next" type="button" aria-label="Next exercise">›</button>
</div>
<p id="section-note"></p>

<div class="timer">
  <div id="step-label"></div>
  <div id="clock">0:00</div>
  <div class="controls">
    <button class="adj" id="minus" type="button" aria-label="5 seconds less">−5</button>
    <button id="go" type="button">Go</button>
    <button class="adj" id="plus" type="button" aria-label="5 seconds more">+5</button>
  </div>
  <div id="adjust"></div>
  <div id="steps"></div>
</div>

<div class="card" id="card">
  <div id="tabs" role="tablist" aria-label="Exercises in this pair"></div>
  <h2 id="name"></h2>
  <p id="sets"></p>
  <p id="desc"></p>
  <figure id="figure"><div id="figure-svg"></div><figcaption id="figure-caption"></figcaption></figure>
  <p class="note" id="progress"><strong>Progress:</strong> <span id="progress-text"></span></p>
  <p class="note" id="caution"><strong id="caution-label"></strong> <span id="caution-text"></span></p>
</div>

<script src="../plan.js"></script>
<script src="exercises.js"></script>
<script src="../app.js"></script>
</body>
</html>
